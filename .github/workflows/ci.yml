name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: python scripts/validate_sources.py sources.json
      - run: python -m pytest -q
      - run: python -m ruff check scripts tests
      - name: Compile release tooling
        run: python -m py_compile scripts/*.py
