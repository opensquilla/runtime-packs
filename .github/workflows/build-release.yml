name: Build Runtime Pack Draft

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Exact reviewed tag from sources.json (for example v2026.07.30.1)
        required: true
      createDraft:
        description: Create the protected GitHub Draft Release after all audits pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-pack-${{ inputs.releaseTag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      releaseTag: ${{ steps.contract.outputs.releaseTag }}
      catalogVersion: ${{ steps.contract.outputs.catalogVersion }}
    steps:
      - name: Require the reviewed main branch
        env:
          DISPATCH_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${DISPATCH_REF}" == "refs/heads/main" ]] || {
            echo "Runtime Pack drafts may be built only from main." >&2
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - id: contract
        env:
          REQUESTED_TAG: ${{ inputs.releaseTag }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_sources.py sources.json
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          from pathlib import Path

          value = json.loads(Path("sources.json").read_text(encoding="utf-8"))
          requested = os.environ["REQUESTED_TAG"]
          if requested != value["releaseTag"]:
              raise SystemExit(
                  f"Requested tag {requested!r} does not match reviewed {value['releaseTag']!r}"
              )
          print(f"releaseTag={value['releaseTag']}")
          print(f"catalogVersion={value['catalogVersion']}")
          PY
      - run: python -m pytest -q
      - run: python -m ruff check scripts tests

  build:
    needs: validate
    name: ${{ matrix.target }} / ${{ matrix.component }} native build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, component: python, runner: '["self-hosted","opensquilla-runtime","darwin-arm64"]' }
          - { target: darwin-arm64, component: node, runner: '["self-hosted","opensquilla-runtime","darwin-arm64"]' }
          - { target: darwin-x64, component: python, runner: '["self-hosted","opensquilla-runtime","darwin-x64"]' }
          - { target: darwin-x64, component: node, runner: '["self-hosted","opensquilla-runtime","darwin-x64"]' }
          - { target: linux-arm64, component: python, runner: '["self-hosted","opensquilla-runtime","linux-arm64","glibc"]' }
          - { target: linux-arm64, component: node, runner: '["self-hosted","opensquilla-runtime","linux-arm64","glibc"]' }
          - { target: linux-x64, component: python, runner: '["self-hosted","opensquilla-runtime","linux-x64","glibc"]' }
          - { target: linux-x64, component: node, runner: '["self-hosted","opensquilla-runtime","linux-x64","glibc"]' }
          - { target: windows-arm64, component: python, runner: '["self-hosted","opensquilla-runtime","windows-arm64"]' }
          - { target: windows-arm64, component: node, runner: '["self-hosted","opensquilla-runtime","windows-arm64"]' }
          - { target: windows-arm64, component: gitBash, runner: '["self-hosted","opensquilla-runtime","windows-arm64"]' }
          - { target: windows-x64, component: python, runner: '["self-hosted","opensquilla-runtime","windows-x64"]' }
          - { target: windows-x64, component: node, runner: '["self-hosted","opensquilla-runtime","windows-x64"]' }
          - { target: windows-x64, component: gitBash, runner: '["self-hosted","opensquilla-runtime","windows-x64"]' }
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate runner and source contract
        shell: bash
        run: python scripts/validate_sources.py sources.json
      - name: Build, probe, license, SBOM, and deterministically repack
        env:
          OPENSQUILLA_TRUSTED_WINDOWS_CI: ${{ matrix.component == 'gitBash' && '1' || '0' }}
        shell: bash
        run: >-
          python -m scripts.build_pack
          --sources sources.json
          --target '${{ matrix.target }}'
          --component '${{ matrix.component }}'
          --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ matrix.target }}-${{ matrix.component }}
          path: |
            dist/*.tar.xz
            dist/*.tar.xz.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  aggregate:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runtime-*
          path: native-dist
          merge-multiple: true
      - name: Generate immutable catalog and exact release set
        run: >-
          python -m scripts.generate_release
          --sources sources.json
          --build-dir native-dist
          --output-dir release-dist
      - name: Audit generated release again from disk
        run: >-
          python -m scripts.generate_release
          --sources sources.json
          --audit-only
          --output-dir release-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-pack-release-${{ needs.validate.outputs.releaseTag }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  draft-release:
    if: ${{ inputs.createDraft }}
    needs: [validate, aggregate]
    runs-on: ubuntu-latest
    environment: runtime-pack-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-pack-release-${{ needs.validate.outputs.releaseTag }}
          path: release-dist
      - name: Refuse to mutate an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.releaseTag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; use a new immutable catalog version." >&2
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; use a new immutable catalog version." >&2
            exit 1
          fi
      - name: Create Draft Release (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.releaseTag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release-dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --draft \
            --title "OpenSquilla Runtime Packs ${RELEASE_TAG}" \
            --notes "Native-probed optional runtimes. Review SHA256SUMS, catalog, SBOM, licenses, and runner results before publishing."
      - name: Download and re-audit the exact Draft Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.releaseTag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-readback
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-readback
          python -m scripts.generate_release \
            --sources sources.json \
            --audit-only \
            --output-dir release-readback
